spring.application.name=OrderFlow

# Test database configuration - in-memory H2 used for CI/tests to avoid requiring external MySQL
spring.datasource.url=jdbc:h2:mem:orderflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# JWT configuration
jwt.secret=replace_with_a_long_random_secret_at_least_32_characters_long_for_hmac
jwt.expiration=3600000

# Logging
logging.level.org.springframework.web=INFO